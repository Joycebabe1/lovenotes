<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For my love Jett</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: #d7f0dd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            color: #4a7c59;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            color: #7eb28a;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .login-area{
            width:100%;
        }
        .login-area input{
            width:80%;
            padding:14px;
            border-radius:12px;
            border:1px solid #b8ddc3;
            font-size:16px;
            outline:none;
        }
        .login-btn{
            margin-top:16px;
            padding:12px 32px;
            border: none;
            border-radius: 12px;
            background: #87c99b;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 40px;
        }

        .mode-btn {
            padding: 22px 12px;
            border: none;
            border-radius: 16px;
            background: #ffffff;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            transform: translateY(-4px);
            background: #f4fcf6;
        }

        .input-area {
            display: none;
            width: 100%;
        }

        .title-bar {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .title-bar h2 {
            font-size: 20px;
            color: #4a7c59;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #b8ddc3;
            background: #fff;
            font-size: 16px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .send-btn {
            margin-top: 16px;
            padding: 12px 32px;
            border: none;
            border-radius: 12px;
            background: #87c99b;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #74b88a;
        }

        .back-btn {
            margin-top: 12px;
            background: transparent;
            color: #598c67;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
        .record-toggle-btn{
            margin-top:20px;
            padding:10px 24px;
            border-radius:10px;
            border:1px solid #87c99b;
            background:#fff;
            color:#4a7c59;
            cursor:pointer;
        }
        .record-box {
            margin-top:16px;
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            display:none;
        }

        .record-box h3 {
            color: #4a7c59;
            margin-bottom: 12px;
            font-size: 17px;
        }

        .record-item {
            background: #f4fcf6;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 15px;
            line-height: 1.6;
            color: #555;
        }

        .record-item:last-child {
            margin-bottom: 0;
        }

        .empty-tip {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>For my love Jett</h1>
        <p class="subtitle">把情绪、秘密和开心都轻轻放进来</p >

        <!-- 用户名登录页 -->
        <div class="login-area" id="loginPanel">
            <input type="text" id="usernameInput" placeholder="请输入你的名字">
            <br>
            <button class="login-btn" id="loginBtn">进入</button>
        </div>

        <!-- 第一步：选择四个空间 -->
        <div class="btn-group" id="selectPanel" style="display:none">
            <button class="mode-btn" data-type="trash">🗑️<br>垃圾桶</button>
            <button class="mode-btn" data-type="whisper">🤫<br>悄悄话</button>
            <button class="mode-btn" data-type="moment">🥰<br>sweet moments</button>
            <button class="mode-btn" data-type="murmur">💭<br>碎碎念</button>
        </div>

        <!-- 第二步：写入内容 -->
        <div class="input-area" id="inputPanel">
            <div class="title-bar">
                <h2 id="titleText"></h2>
            </div>

            <textarea id="contentInput" placeholder="在这里写下你的文字..."></textarea>

            <button class="send-btn" id="sendBtn"></button>
            <br>
            <button class="back-btn" id="backBtn">← 返回重新选择</button>

            <!-- 查看记录按钮，默认隐藏记录面板 -->
            <button class="record-toggle-btn" id="recordToggleBtn">我的记录</button>
            <div class="record-box" id="recordBox">
                <h3>我的记录</h3>
                <div id="recordList">
                    <div class="empty-tip">还没有记录，发送第一条内容吧</div>
                </div>
            </div>
        </div>
    </div>
<script>
// 等整个页面全部DOM、外部JS加载完成后，再执行代码
window.addEventListener('load', async function(){
    const SUPABASE_URL = "https://jhwvrkybppblaxipzatzt.supabase.co";
    const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impod3Zya3licGJsYXhpcHphdHp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTA4MzEsImV4cCI6MjEwNzQ2NjgzMX0.q0uYDzEFDKnm30LsG2fdnSF_npcMkpYaPGGUZm-GHS4";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginPanel = document.getElementById('loginPanel');
    const selectPanel = document.getElementById('selectPanel');
    const inputPanel = document.getElementById('inputPanel');
    const titleText = document.getElementById('titleText');
    const contentInput = document.getElementById('contentInput');
    const backBtn = document.getElementById('backBtn');
    const sendBtn = document.getElementById('sendBtn');
    const recordToggleBtn = document.getElementById('recordToggleBtn');
    const recordBox = document.getElementById('recordBox');
    const recordList = document.getElementById('recordList');
    const usernameInput = document.getElementById('usernameInput');
    const loginBtn = document.getElementById('loginBtn');

    let currentUser = "";
    let currentType = "";

    const typeConfig = {
        trash: {
            name: "🗑️ 垃圾桶",
            btnText: "🚮通通丢掉!"
        },
        whisper: {
            name: "🤫 悄悄话",
            btnText: "🌳烦恼悄悄放在树洞"
        },
        moment: {
            name: "🥰 sweet moments",
            btnText: "💌Share with Joyce"
        },
        murmur: {
            name: "💭 碎碎念",
            btnText: "✍️胡思乱想的小记"
        }
    };

    // 登录
    loginBtn.onclick = async function(){
        const name = usernameInput.value.trim();
        if(!name){
            alert("请输入名字");
            return;
        }
        currentUser = name;
        loginPanel.style.display="none";
        selectPanel.style.display="grid";
    }

    // 渲染当前用户云端记录
    async function renderRecords() {
        const {data,error} = await supabase.from('notes').select('*').eq('username',currentUser).order('create_at',{ascending:false});
        if(error){
            alert(error.message);
            return;
        }
        if (data.length === 0) {
            recordList.innerHTML = '<div class="empty-tip">还没有记录，发送第一条内容吧</div>';
            return;
        }
        recordList.innerHTML = '';
        data.forEach(record => {
            const item = document.createElement('div');
            item.className = 'record-item';
            item.innerHTML = `
                <div><strong>${record.type_name}</strong></div>
                <div>${record.content}</div>
                <div style="font-size: 12px; color: #999; margin-top: 8px;">${new Date(record.create_at).toLocaleString('zh-CN')}</div>
            `;
            recordList.appendChild(item);
        });
    }

    // 点击分类按钮
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.onclick = function () {
            currentType = this.dataset.type;
            titleText.innerText = typeConfig[currentType].name;
            sendBtn.innerText = typeConfig[currentType].btnText;
            selectPanel.style.display = 'none';
            inputPanel.style.display = 'block';
            contentInput.value = '';
            recordBox.style.display="none";
        };
    });

    // 返回选择页
    backBtn.onclick = function () {
        inputPanel.style.display = 'none';
        selectPanel.style.display = 'grid';
    };

    // 查看/隐藏记录 切换按钮
    recordToggleBtn.onclick = async function(){
        if(recordBox.style.display === "none"){
            await renderRecords();
            recordBox.style.display = "block";
            this.innerText = "关闭记录";
        }else{
            recordBox.style.display = "none";
            this.innerText = "我的记录";
        }
    }

    // 发送，写入云端数据库
    sendBtn.onclick = async function () {
        const text = contentInput.value.trim();
        if (!text) {
            alert('请输入内容哦');
            return;
        }
        const {error} = await supabase.from('notes').insert([{
            username:currentUser,
            type_name:typeConfig[currentType].name,
            content:text
        }]);
        if(error){
            alert("提交失败："+error.message);
            return;
        }
        alert('✅发送成功！');
        contentInput.value = '';
    };
})
</script>
</body>
</html>
